version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - ProjectHash=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - npm install -g webpack webpack-cli #electron-builder
      - npm ci --legacy-peer-deps
  build:
    commands:
      - NODE_OPTIONS=--openssl-legacy-provider webpack --mode=production
      #- electron-builder -w
      - aws cloudformation package --template-file ./template.yml --s3-bucket ${Bucket} --output-template-file serverless.yml
  post_build:
    commands:
      - node update.js ProjectName=$ProjectName ProjectHash=$ProjectHash Environment=$Environment DeploymentBucket=$DeploymentBucket
artifacts:
  secondary-artifacts:
    S3SiteFiles:
      discard-paths: yes
      files:
        - dist/*
    BuildOutput:
      discard-paths: yes
      files:
        - serverless.yml
        - config.json
